<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuduPay</title>
    <!--
      Aplica o tema antes do React montar, para o tema escuro não piscar claro.
      Repete a regra do ThemeProvider (mesma chave e prioridade); o teste
      src/index-html.test.ts vigia que os dois não se separem.
    -->
    <script>
      ;(function () {
        var escolha = null
        try {
          escolha = localStorage.getItem('dudupay-theme')
        } catch (e) {}
        var escuro =
          escolha === 'dark' ||
          (escolha !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var raiz = document.documentElement
        if (escuro) raiz.classList.add('dark')
        raiz.style.colorScheme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
